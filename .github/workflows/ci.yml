name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: make all

      - name: External W65C02 functional qualification
        run: |
          curl -L --fail -o build/65C02_extended_opcodes_test.bin \
            https://raw.githubusercontent.com/Klaus2m5/6502_65C02_functional_tests/7954e2dbb49c469ea286070bf46cdd71aeb29e4b/bin_files/65C02_extended_opcodes_test.bin
          test "$(wc -c < build/65C02_extended_opcodes_test.bin)" -eq 65536
          make qualification

      - name: Validate C bridge inputs
        run: |
          test -s toolchain/llvm-mos.version
          grep -q -- '--target=mos' scripts/compile-c-to-asm.sh
          grep -q -- 'mosw65c02' scripts/compile-c-to-asm.sh

  c-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM-MOS SDK
        run: |
          SDK_VERSION=$(sed -n '/^[^#]/p' toolchain/llvm-mos.version | head -n1)
          curl -L --fail -o /tmp/llvm-mos.tar.xz \
            "https://github.com/llvm-mos/llvm-mos-sdk/releases/download/${SDK_VERSION}/llvm-mos-linux.tar.xz"
          tar -xJf /tmp/llvm-mos.tar.xz -C /tmp
          echo "/tmp/llvm-mos/bin" >> "$GITHUB_PATH"

      - name: Identify compiler
        run: |
          clang --version
          echo "Pinned SDK release: $(sed -n '/^[^#]/p' toolchain/llvm-mos.version | head -n1)"

      - name: Generate M4 assembly
        run: |
          chmod +x scripts/compile-c-to-asm.sh scripts/build-c-labs.sh scripts/build-optimization-lab.sh
          scripts/build-c-labs.sh
          scripts/build-optimization-lab.sh
          test -s build/compiler-output/03-functions.s
          test -s build/compiler-output/04-pointers.s
          test -s build/compiler-output/05-arrays.s
          test -s build/optimization/06-locals-O0.s
          test -s build/optimization/06-locals-O2.s

      - name: Inspect representative compiler output
        run: |
          echo '=== functions O1 ==='
          cat build/compiler-output/03-functions.s
          echo '=== pointers O1 ==='
          cat build/compiler-output/04-pointers.s
          echo '=== locals O0 ==='
          cat build/optimization/06-locals-O0.s
          echo '=== locals O2 ==='
          cat build/optimization/06-locals-O2.s
